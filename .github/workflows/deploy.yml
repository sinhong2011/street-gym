name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: deploy-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Type-check + production build
      - run: pnpm build

      - name: Check deploy credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable not set — skipping deploy."
          fi

      # Branch names are attacker-controllable: pass via env and strip to a safe alias.
      - name: Resolve branch
        id: branch
        env:
          RAW: ${{ github.head_ref || github.ref_name }}
        run: |
          SAFE=$(printf '%s' "$RAW" | tr -c 'A-Za-z0-9-' '-' | cut -c1-40)
          echo "name=${SAFE:-preview}" >> "$GITHUB_OUTPUT"

      # Production on main, preview per branch; never for PRs from forks (no secrets there).
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.creds.outputs.ok == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name street-gym --branch ${{ steps.branch.outputs.name }} --commit-hash ${{ github.sha }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.deployment-url != ''
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const url = process.env.URL;
            const body = `🔍 Preview deployed: ${url}\n\nCommit: ${context.sha.slice(0, 7)}`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith('🔍 Preview deployed'));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
